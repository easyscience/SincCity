site_name: SincCity
site_description: 'Generic Scattering Calculator: I(q) of a real-space structure (PDB, GRO, SLD or VTK)'
site_url: https://easyscience.github.io/SincCity/
repo_url: https://github.com/easyscience/SincCity
repo_name: easyscience/SincCity
edit_uri: edit/master/docs/
copyright: BSD 3-Clause, SincCity contributors

nav:
  - Home: index.md
  - User guide:
      - Structures: guide/structures.md
      - Calculation: guide/calculation.md
      - Series and reproducibility: guide/series.md
      - Coming from coords2sans: guide/coords2sans.md
  - API reference:
      - Calculator: api/calculator.md
      - Structures: api/structures.md
      - Readers: api/readers.md
      - Debye sums: api/debye.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/brightness-7
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false  # array-like arguments are documented, not annotated
            members_order: source
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            filters: ['!^_']
