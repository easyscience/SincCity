[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SincCity"
version = "0.2.0"
description = "Generic Scattering Calculator: I(q) of a real-space structure (PDB, GRO, SLD or VTK)"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "SincCity contributors"}
]
readme = "README.md"
dependencies = [
    "numpy>=2.0",
    "periodictable>=1.6",
]

[project.urls]
Documentation = "https://easyscience.github.io/SincCity/"
Source = "https://github.com/easyscience/SincCity"

[project.optional-dependencies]
plot = [
    "plotly>=5.0",
]
sasdata = [
    "sasdata>=0.8",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=1.0",
]
dev = [
    "sinccity[plot,sasdata]",
    "pytest>=7.0",
    "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
