[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SincCity"
version = "0.1.0"
description = "Generic Scattering Calculator: I(q) of a real-space structure (PDB, SLD or VTK)"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "SincCity contributors"}
]
readme = "README.md"
dependencies = [
    "numpy>=2.0",
    "periodictable>=1.6",
]

[project.optional-dependencies]
plot = [
    "plotly>=5.0",
]
sasdata = [
    "sasdata>=0.8",
]
dev = [
    "sinccity[plot,sasdata]",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
